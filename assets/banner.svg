<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#090d16; border-radius: 14px; overflow: hidden;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1222" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>

    <linearGradient id="barGrad1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="barGrad2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <linearGradient id="barGrad3" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>

    <!-- Filter for soft neon glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .bg-grid { stroke: #1e293b; stroke-width: 1; stroke-opacity: 0.35; }
      .floating-particle { animation: float 6s ease-in-out infinite alternate; }
      .bar-anim-1 { animation: barPulse1 3s ease-in-out infinite alternate; transform-origin: bottom; }
      .bar-anim-2 { animation: barPulse2 3.5s ease-in-out infinite alternate; transform-origin: bottom; }
      .bar-anim-3 { animation: barPulse3 4s ease-in-out infinite alternate; transform-origin: bottom; }
      .shimmer { animation: shimmerEffect 5s linear infinite; }
      .badge-glow { animation: pulseGlow 3s ease-in-out infinite alternate; }

      @keyframes float {
        0% { transform: translateY(0px) rotate(0deg); }
        100% { transform: translateY(-16px) rotate(8deg); }
      }
      @keyframes barPulse1 {
        0% { transform: scaleY(0.7); }
        100% { transform: scaleY(1.05); }
      }
      @keyframes barPulse2 {
        0% { transform: scaleY(0.8); }
        100% { transform: scaleY(1.15); }
      }
      @keyframes barPulse3 {
        0% { transform: scaleY(0.65); }
        100% { transform: scaleY(1.1); }
      }
      @keyframes pulseGlow {
        0% { opacity: 0.4; }
        100% { opacity: 0.85; }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" fill="url(#bgGlow)" />

  <!-- Animated Ambient Backdrop Glows -->
  <circle cx="150" cy="180" r="140" fill="#38bdf8" opacity="0.12" filter="url(#glow)" class="badge-glow" />
  <circle cx="1050" cy="120" r="180" fill="#818cf8" opacity="0.15" filter="url(#glow)" class="badge-glow" />
  <circle cx="600" cy="320" r="160" fill="#c084fc" opacity="0.08" filter="url(#glow)" />

  <!-- Geometric Grid Pattern (Background layer only) -->
  <g class="bg-grid">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    
    <line x1="120" y1="0" x2="120" y2="360" />
    <line x1="240" y1="0" x2="240" y2="360" />
    <line x1="360" y1="0" x2="360" y2="360" />
    <line x1="840" y1="0" x2="840" y2="360" />
    <line x1="960" y1="0" x2="960" y2="360" />
    <line x1="1080" y1="0" x2="1080" y2="360" />
  </g>

  <!-- Dynamic Right-Side Graphic: Leaderboard & Performance Bars (Subtle & In Background) -->
  <g opacity="0.85" transform="translate(900, 110)">
    <!-- Glass Podium Backplate -->
    <rect x="-40" y="20" width="280" height="190" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    
    <!-- Animated Chart Podium Bars -->
    <!-- 2nd Place Bar -->
    <rect x="0" y="110" width="46" height="75" rx="6" fill="url(#barGrad2)" class="bar-anim-1" />
    <text x="23" y="98" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle">#2</text>
    
    <!-- 1st Place Bar -->
    <rect x="65" y="65" width="54" height="120" rx="8" fill="url(#barGrad3)" class="bar-anim-2" />
    <text x="92" y="52" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" text-anchor="middle">👑 #1</text>
    
    <!-- 3rd Place Bar -->
    <rect x="138" y="130" width="46" height="55" rx="6" fill="url(#barGrad1)" class="bar-anim-3" />
    <text x="161" y="118" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle">#3</text>

    <!-- Mini KPI Stat Pill in card -->
    <g transform="translate(195, 45)">
      <circle cx="0" cy="0" r="14" fill="#10b981" opacity="0.2" />
      <path d="M-6 2 L-2 -3 L2 0 L6 -6" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>

  <!-- Floating Ambient Gamification Elements (Decorations away from center title) -->
  <g class="floating-particle" style="animation-duration: 7s;">
    <!-- Trophy Icon Top Left -->
    <circle cx="85" cy="80" r="32" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" />
    <text x="85" y="89" font-size="28" text-anchor="middle">🏆</text>
  </g>

  <g class="floating-particle" style="animation-duration: 9s; animation-delay: -2s;">
    <!-- Target / Bullseye Lower Left -->
    <circle cx="105" cy="275" r="28" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <text x="105" y="284" font-size="24" text-anchor="middle">🎯</text>
  </g>

  <g class="floating-particle" style="animation-duration: 8s; animation-delay: -4s;">
    <!-- Rocket Icon Top Right -->
    <circle cx="1115" cy="70" r="26" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" />
    <text x="1115" y="78" font-size="22" text-anchor="middle">🚀</text>
  </g>

  <!-- FOREGROUND CONTENT: Header, Badge, Titles, Subtitle (Guaranteed 100% Clear & Legible) -->
  <!-- Top Category Pill Tag -->
  <g transform="translate(200, 68)">
    <rect x="0" y="0" width="310" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.95" />
    <circle cx="16" cy="16" r="5" fill="#38bdf8" class="badge-glow" />
    <text x="32" y="21" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">CURATED REVENUE ARCHITECTURE</text>
  </g>

  <!-- Main Title Line 1 -->
  <text x="200" y="145" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5">
    AWESOME SALES GAMIFICATION
  </text>

  <!-- Main Title Line 2 with Gradient Accent -->
  <text x="200" y="200" fill="url(#primaryGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="40" font-weight="900" letter-spacing="-0.5">
    &amp; PERFORMANCE TRACKING
  </text>

  <!-- Subtitle Paragraph -->
  <text x="200" y="244" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400">
    The definitive guide to SaaS platforms, open-source engines, TV leaderboards,
  </text>
  <text x="200" y="270" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400">
    and motivation architecture to accelerate pipeline velocity &amp; quota attainment.
  </text>

  <!-- Bottom Dynamic Feature Chips -->
  <g transform="translate(200, 298)">
    <!-- Chip 1 -->
    <rect x="0" y="0" width="130" height="26" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="65" y="17" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">⚡ Real-Time KPIs</text>

    <!-- Chip 2 -->
    <rect x="142" y="0" width="145" height="26" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="214.5" y="17" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">🏆 TV Leaderboards</text>

    <!-- Chip 3 -->
    <rect x="299" y="0" width="145" height="26" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="371.5" y="17" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">🤖 AI Sales Coaching</text>

    <!-- Chip 4 -->
    <rect x="456" y="0" width="135" height="26" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="523.5" y="17" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">🔓 Open-Source</text>
  </g>
</svg>
